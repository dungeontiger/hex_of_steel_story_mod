name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/Story.Tests/Story.Tests.csproj --locked-mode
      - run: dotnet test tests/Story.Tests/Story.Tests.csproj -c ${{ matrix.configuration }} --no-restore
# Local game integration tests require a licensed installation; game DLLs are never published.
